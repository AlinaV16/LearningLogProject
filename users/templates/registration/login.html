{% extends "mainapp/base.html" %}

{% block content %}

{% if form.errors %}
<P>Your username and password did not match. Please try again.</P>
{% endif %}

<form action="{% url 'users:login' %}" method='post'>

    {% csrf_token %}

    {{ form.as_p }}

    <button name="sumbit">Login</button>
    <input type="hidden" name="next" value="{% url 'MainApp:index'%}" />

</form>


{% endblock content %}
